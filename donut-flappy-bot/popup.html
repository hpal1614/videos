<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 220px; margin: 0; font: 13px/1.4 system-ui, sans-serif;
      background: #15151c; color: #fff; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
    button { width: 100%; padding: 9px; border: 0; border-radius: 8px;
      background: #ff4fb8; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
    p { font-size: 11px; color: #9ab; margin: 8px 0 0; }
    code { background: #2a2a36; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🍩 Donut Autoplayer</h1>
  <button id="toggle">▶ Start / Stop</button>
  <p>Open the game, then click this (or press <code>Ctrl+Shift+B</code>).
     A panel appears top-right of the page with live tuning sliders.</p>
  <script src="popup.js"></script>
</body>
</html>
